{{- if .Values.metrics.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ksmAppName" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: {{ include "appName" . }}
      app.kubernetes.io/component: kube-state-metrics
      app.kubernetes.io/name: {{ include "ksmPodLabel" . }}
  template:
    metadata:
      name: {{ include "ksmAppName" . }}
      labels:
        app.kubernetes.io/part-of: {{ include "appName" . }}
        app.kubernetes.io/component: kube-state-metrics
        app.kubernetes.io/name: {{ include "ksmPodLabel" . }}
    spec:
      serviceAccountName: {{ include "ksmServiceAccountName" . }}

      {{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}

      containers:
        - name: kube-state-metrics
          image: {{ .Values.kubeStateMetrics.image | quote }}
          args:
            - --resources={{ join "," .Values.kubeStateMetrics.resources }}
          ports:
            - name: http
              containerPort: {{ include "ksmPodHttpPort" . }}
              protocol: TCP
            - name: telemetry
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # /readyz is served on the telemetry port, not the metrics port.
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end -}}
