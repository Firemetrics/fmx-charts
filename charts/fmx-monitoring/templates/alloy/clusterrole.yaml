{{- if (include "alloyEnabled" .) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "alloyClusterRoleName" . }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
      - pods/log
      - configmaps
    verbs:
      - get
      - list
      - watch
  # Scraping the kubelet's /metrics and /metrics/cadvisor endpoints directly
  # (port 10250) is authorized by the kubelet as a GET on nodes/metrics.
  - apiGroups: [""]
    resources:
      - nodes/metrics
    verbs:
      - get
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
{{- end -}}
